name: Daily energy pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC (08:00 German summer time)
  workflow_dispatch:       # allows a manual run from GitHub or the CLI

permissions:
  contents: read
  actions: write           # needed to disable the workflow after the Snowflake trial

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}

    steps:
      - name: Disable the schedule after the Snowflake trial ends
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" > "2026-10-30" ]]; then
            gh workflow disable daily_pipeline.yml --repo "${{ github.repository }}"
            echo "Snowflake trial ending: the daily schedule has been disabled after this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write the Snowflake private key to a temporary file
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/rsa_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/rsa_key.p8" >> "$GITHUB_ENV"

      - name: Extract yesterday's data from Energy-Charts
        run: python scripts/download_data.py

      - name: Load into Snowflake Bronze
        run: python scripts/load_to_bronze.py

      - name: Build and test Silver and Gold with dbt
        working-directory: energy_dbt
        run: dbt build

      - name: Publish the daily summary
        run: python scripts/daily_summary.py

      - name: Upload dbt logs if something failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dbt-logs
          path: energy_dbt/logs/
